name: sticker_maker
description: Custom WhatsApp Sticker Maker personal en Flutter.
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.5
  flutter_image_compress: ^2.3.0
  image_picker: ^1.1.2
  uuid: ^4.5.1
  google_mlkit_subject_segmentation: ^0.0.2
  archive: ^3.6.1
  file_picker: ^8.1.4
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FF66A3"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/characters/